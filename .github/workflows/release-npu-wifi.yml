name: Release PonWrt (WiFi flow offload)

# Fork-friendly build that compiles PonWrt for the AN7581 HG5585F with the
# Airoha PPE wired->wireless flow offload wired into mt7915.
#
# What the change does:
#
#   mt7915_net_fill_forward_path() used to live behind
#   CONFIG_NET_MEDIATEK_SOC_WED and bail out unless the mediatek WED was
#   running.  The Airoha PPE asks the very same question through
#   dev_fill_forward_path(), so the function is compiled unconditionally now
#   and also answers when an Airoha PPE sits behind the device, reporting
#   DEV_PATH_MTK_WDMA with wdma_idx set to the band.
#
#   Nothing else is needed on the host.  airoha_ppe_foe_entry_prepare() calls
#   airoha_ppe_get_wdma_info(), sees DEV_PATH_MTK_WDMA on the last hop and
#   programs FE_PSE_PORT_CDM4 plus AIROHA_FOE_IB2_NBQ / AIROHA_FOE_ACTDP /
#   AIROHA_FOE_MAC_WDMA_BAND / AIROHA_FOE_MAC_WDMA_WCID from the answer.
#
# What it deliberately does NOT do:
#
#   No mt76_npu_init().  That helper is for the eagle chips: it sets
#   dev->dma_dev, hwrro_mode and rx_token_size, and recording the NPU in
#   dev->mmio.npu would make mt76_npu_device_active() true, which flips both
#   mt76_dma_tx_queue_skb() and mt76_rx_poll_complete() over to the eagle
#   descriptor layout and to RRO-style reordering.  MT7915/MT7916 are kite
#   chips and speak neither.  The patch only takes a reference on the PPE and
#   stores it in the mt7915 private structure.
#
#   No wireless->wired direction.  It needs HW-RRO for RX packet reordering
#   and kite chips publish no RRO ring; that is a missing hardware capability,
#   not missing code.
#
#   No mt76 package Makefile change: CONFIG_MT76_NPU stays off for
#   kmod-mt7915e, because none of the generic NPU plumbing is used.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-npu-wifi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: an7581
            device_symbol: 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu=y'
            image_glob: '*fiberhome_hg5585f*sysupgrade*'

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      # The whole host-side change lives in the tree, so a checkout that lost
      # it has to stop the run before a single object is compiled.  Three
      # separate promises are checked: the patch that the mt76 package has to
      # pick up, the kernel config that provides the airoha PPE, and the board
      # device tree that declares the offload.
      - name: Verify the tree carries the offload change
        run: |
          patch=package/kernel/mt76/patches/120-mt7915-airoha-ppe-flow-offload.patch
          test -f "$patch" || {
            echo "::error::$patch is missing from the tree"
            ls -l package/kernel/mt76/patches/
            exit 1
          }

          # Only strings that live inside code hunks, so a patch that lost its
          # hunks but kept its commit message cannot pass.
          for token in \
              'mt7915_ppe_attach' \
              'airoha_ppe_get_dev(dev->mt76.dev)' \
              'rcu_access_pointer(dev->ppe_dev)' \
              'path->mtk_wdma.wdma_idx = phy->mt76->band_idx;'; do
            grep -qF "$token" "$patch" || {
              echo "::error::$patch does not contain: $token"
              exit 1
            }
          done
          echo "the mt7915 flow offload patch is present"

          # The abandoned NPU-based attempt would re-add mt76_npu_attach() and
          # force CONFIG_MT76_NPU on for kmod-mt7915e, which hijacks TX and RX.
          stale=package/kernel/mt76/patches/120-mt7915-airoha-npu-tx-offload.patch
          test ! -e "$stale" || {
            echo "::error::$stale is still in the tree"
            exit 1
          }

          awk '
            /^ifdef CONFIG_PACKAGE_kmod-mt7915e/ { in_blk = 1; depth = 0; found = 0; next }
            !in_blk { next }
            /^ifdef/ || /^ifneq/ { depth++; next }
            /^endif/ { if (depth == 0) { in_blk = 0 } else { depth-- }; next }
            /CONFIG_MT76_NPU/ { found = 1 }
            END { exit found ? 1 : 0 }
          ' package/kernel/mt76/Makefile || {
            echo "::error::the kmod-mt7915e branch must not turn CONFIG_MT76_NPU on"
            grep -n -A14 'CONFIG_PACKAGE_kmod-mt7915e' package/kernel/mt76/Makefile
            exit 1
          }
          echo "kmod-mt7915e leaves CONFIG_MT76_NPU off"

          kconfig=target/linux/airoha/an7581/config-6.18
          grep -q '^CONFIG_NET_AIROHA=y$' "$kconfig" || {
            echo "::error::$kconfig lacks CONFIG_NET_AIROHA"
            exit 1
          }
          grep -q '^CONFIG_NET_AIROHA_NPU=y$' "$kconfig" || {
            echo "::error::$kconfig lacks CONFIG_NET_AIROHA_NPU"
            exit 1
          }
          echo "the an7581 kernel config enables the airoha offload engine"

          dts=target/linux/airoha/dts/an7581-fiberhome-hg5585f-common.dtsi
          grep -q 'airoha,eth' "$dts" || {
            echo "::error::$dts does not declare airoha,eth"
            exit 1
          }
          grep -q 'airoha,npu' "$dts" || {
            echo "::error::$dts does not declare airoha,npu"
            exit 1
          }
          echo "the HG5585F device tree declares the offload"

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Must run after the feed is cloned and before make starts. The script
      # aborts the job when a patch no longer applies or an assertion fails.
      - name: Apply GPON patches to the pon_drivers feed
        run: sh .github/scripts/patch-feed.sh "$PWD"

      - name: Prepare APK signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          else
            echo "no PONWRT_APK_PRIVATE_KEY secret; the build generates a throwaway key"
          fi

      - name: Configure ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          DEVICE_SYMBOL: ${{ matrix.device_symbol }}
        run: |
          ./scripts/kconfig.pl + "configs/$TARGET.config" configs/release.config > .config
          make defconfig

          # Kconfig drops unknown symbols silently, so assert the config that
          # actually matters.  Only top level symbols can be checked here:
          # target/linux/airoha/an7581/config-6.18 is a kernel fragment and is
          # merged into the kernel .config at prepare time, so it never shows
          # up in this file.  The kernel side is asserted in the tree check
          # above and re-checked after the build.
          grep -q "^CONFIG_TARGET_airoha_${TARGET}=y$" .config
          grep -q "^${DEVICE_SYMBOL}$" .config
          echo "board symbol verified: $DEVICE_SYMBOL"
          grep -q '^CONFIG_PACKAGE_kmod-mt76-core=m$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7915e=m$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7916-firmware=m$' .config
          grep -q '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config
          echo "config verified for $TARGET"

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      # End-to-end proof that the firmware carries the patched driver and that
      # the kernel it links against really has the Airoha offload engine.
      #
      # Fingerprint on text that is reachable from code, so it lives in an
      # allocated section: OpenWrt packs kernel modules through
      # scripts/strip-kmod.sh, whose "objcopy -x -G __this_module
      # --strip-unneeded" drops every non-allocated section. .rodata and
      # __ksymtab_strings survive; .modinfo does not.
      - name: Verify the built modules came from the patched sources
        run: |
          check() {
            fingerprint="$1"; shift
            found=''
            for f in $(find build_dir \
                         \( "$@" \) -print 2>/dev/null); do
              if strings "$f" 2>/dev/null | grep -q "$fingerprint"; then
                echo "fingerprint '$fingerprint' present in $f"
                found="$f"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::no built module carries '$fingerprint', refusing to release"
              echo "--- candidates inspected ---"
              find build_dir \( "$@" \) -exec sh -c 'printf "%10s  %s\n" "$(stat -c%s "$1")" "$1"' _ {} \; 2>/dev/null | head -40
              exit 1
            fi
          }

          # mt7915e.ko: the new dev_info() line in mt7915_pci_probe().
          check 'airoha PPE flow offload' \
                -name 'mt7915e.ko*'

          # Unchanged GPON proof, so a tree that silently lost the feed patch
          # fails here too.
          check 'digital RX mode readback' \
                -name 'airoha-xpon-xgpon.o' -o -name 'airoha-xpon.ko*'

          # The kernel has to export the PPE handle the driver now asks for.
          # A missing export would already make modpost fail while linking
          # mt7915e.ko, so this only double checks and explains why.
          kmod=build_dir/target-*/linux-*/linux-*/Module.symvers
          if ls $kmod >/dev/null 2>&1; then
            grep -q 'airoha_ppe_get_dev' $kmod || {
              echo "::error::the kernel does not export airoha_ppe_get_dev"
              exit 1
            }
            echo "kernel exports airoha_ppe_get_dev"
          else
            echo "no Module.symvers found, skipping the export check"
          fi

          # Re-check the kernel build itself picked the fragment up.
          kcfg=$(find build_dir -maxdepth 4 -name .config -path '*/linux-*/*' 2>/dev/null | head -1)
          if [ -n "$kcfg" ]; then
            grep -q '^CONFIG_NET_AIROHA=y$' "$kcfg" || {
              echo "::error::$kcfg lacks CONFIG_NET_AIROHA"
              exit 1
            }
            grep -q '^CONFIG_NET_AIROHA_NPU=y$' "$kcfg" || {
              echo "::error::$kcfg lacks CONFIG_NET_AIROHA_NPU"
              exit 1
            }
            echo "kernel .config carries the airoha offload engine: $kcfg"
          else
            echo "no kernel .config found under build_dir, skipping"
          fi

      - name: Verify the board images exist
        env:
          TARGET: ${{ matrix.target }}
          IMAGE_GLOB: ${{ matrix.image_glob }}
        run: |
          dir="bin/targets/airoha/$TARGET"
          images=$(find "$dir" -maxdepth 1 -name "$IMAGE_GLOB" -print)
          [ -n "$images" ] || {
            echo "::error::no sysupgrade image matching $IMAGE_GLOB for $TARGET"
            ls -l "$dir"
            exit 1
          }
          echo "$images"
          echo "image count: $(printf '%s\n' "$images" | wc -l)"

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG (WiFi flow offload)"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
