name: Release PonWrt (GPON)

# Fork-friendly build that compiles PonWrt with the AN7581/AN7583 GPON line
# mode enabled. Diff against the upstream workflow:
#   * .github/patches is applied to the pon_drivers feed right after
#     ./scripts/feeds update
#   * every step that can fail silently now asserts instead
#
# Both subtargets are built, which is what upstream release.yml does as well.
# The GPON change itself lives entirely in the shared airoha-xpon driver, so
# both subtargets get it from one patch set.
#
# Dispatch this workflow with a tag, then take the sysupgrade image out of the
# release tarball. Nothing here touches the device.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-gpon-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: an7581
            # Twelve boards are enabled by configs/an7581.config and the release
            # tarball carries all of them, so no single board symbol is
            # asserted here. The PON driver is shared, hence one patch set
            # covers the whole subtarget.
            device_symbol: ''
            image_glob: '*sysupgrade*'
          - target: an7583
            # Only two boards exist for this subtarget and the Nokia XG-040G-MF
            # is the one this experiment targets.
            device_symbol: 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y'
            image_glob: '*nokia_xg-040g-mf*sysupgrade*'

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Must run after the feed is cloned and before make starts. The script
      # aborts the job when a patch no longer applies or an assertion fails.
      - name: Apply GPON patches to the pon_drivers feed
        run: sh .github/scripts/patch-feed.sh "$PWD"

      - name: Prepare APK signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          else
            echo "no PONWRT_APK_PRIVATE_KEY secret; the build generates a throwaway key"
          fi

      - name: Configure ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          DEVICE_SYMBOL: ${{ matrix.device_symbol }}
        run: |
          ./scripts/kconfig.pl + "configs/$TARGET.config" configs/release.config > .config
          make defconfig

          # Kconfig drops unknown symbols silently, so assert the config that
          # actually matters for this experiment.
          grep -q "^CONFIG_TARGET_airoha_${TARGET}=y$" .config
          if [ -n "$DEVICE_SYMBOL" ]; then
            grep -q "^${DEVICE_SYMBOL}$" .config
            echo "board symbol verified: $DEVICE_SYMBOL"
          fi
          grep -q '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-airoha-en7572=m$' .config
          grep -q '^CONFIG_PACKAGE_airoha-ponctl=y$' .config
          echo "config verified for $TARGET"

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      # End-to-end proof that the firmware carries the patched driver: the
      # string comes from MODULE_PARM_DESC in the second patch, so it can only
      # be present when the patched source was compiled.
      - name: Verify the built module came from the patched source
        run: |
          module=$(find build_dir -name airoha-xpon.ko -print -quit)
          [ -n "$module" ] || {
            echo "::error::airoha-xpon.ko was not built"
            exit 1
          }
          echo "module: $module"
          strings "$module" | grep -q 'PHY RX sync mode field override' || {
            echo "::error::the built module lacks the patch fingerprint, refusing to release"
            exit 1
          }
          echo "patch fingerprint present"

      - name: Verify the board images exist
        env:
          TARGET: ${{ matrix.target }}
          IMAGE_GLOB: ${{ matrix.image_glob }}
        run: |
          dir="bin/targets/airoha/$TARGET"
          images=$(find "$dir" -maxdepth 1 -name "$IMAGE_GLOB" -print)
          [ -n "$images" ] || {
            echo "::error::no sysupgrade image matching $IMAGE_GLOB for $TARGET"
            ls -l "$dir"
            exit 1
          }
          echo "$images"
          echo "image count: $(printf '%s\n' "$images" | wc -l)"

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG (GPON)"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
