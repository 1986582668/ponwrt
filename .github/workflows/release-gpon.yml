name: Release PonWrt (GPON)

# Fork-friendly build that compiles PonWrt with the AN7581/AN7583 GPON line
# mode enabled. Diff against the upstream workflow:
#   * .github/patches is applied to the pon_drivers feed and
#     .github/patches/pon_userspace to the pon_userspace feed, both right after
#     ./scripts/feeds update
#   * every step that can fail silently now asserts instead
#
# Both subtargets are built, which is what upstream release.yml does as well.
# The kernel side lives entirely in the shared airoha-xpon driver, so both
# subtargets get it from one patch set. The UI side is a second, smaller gap:
# airoha-xpon takes six line modes but the PON page only ever offered four of
# them, so "gpon" was not selectable in LuCI at all and had to be set with uci.
#
# Dispatch this workflow with a tag, then take the sysupgrade image out of the
# release tarball. Nothing here touches the device.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-gpon-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: an7581
            # Twelve boards are enabled by configs/an7581.config and the release
            # tarball carries all of them, so no single board symbol is
            # asserted here. The PON driver is shared, hence one patch set
            # covers the whole subtarget.
            device_symbol: ''
            image_glob: '*sysupgrade*'
          - target: an7583
            # Only two boards exist for this subtarget and the Nokia XG-040G-MF
            # is the one this experiment targets.
            device_symbol: 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y'
            image_glob: '*nokia_xg-040g-mf*sysupgrade*'

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Must run after the feeds are cloned and before make starts. The script
      # aborts the job when a patch no longer applies or an assertion fails.
      - name: Apply GPON patches to the pon_drivers feed
        run: sh .github/scripts/patch-feed.sh "$PWD" pon_drivers

      - name: Apply GPON patches to the pon_userspace feed
        run: sh .github/scripts/patch-feed.sh "$PWD" pon_userspace

      - name: Prepare APK signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          else
            echo "no PONWRT_APK_PRIVATE_KEY secret; the build generates a throwaway key"
          fi

      - name: Configure ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          DEVICE_SYMBOL: ${{ matrix.device_symbol }}
        run: |
          ./scripts/kconfig.pl + "configs/$TARGET.config" configs/release.config > .config
          make defconfig

          # Kconfig drops unknown symbols silently, so assert the config that
          # actually matters for this experiment.
          grep -q "^CONFIG_TARGET_airoha_${TARGET}=y$" .config
          if [ -n "$DEVICE_SYMBOL" ]; then
            grep -q "^${DEVICE_SYMBOL}$" .config
            echo "board symbol verified: $DEVICE_SYMBOL"
          fi
          grep -q '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-airoha-en7572=m$' .config
          grep -q '^CONFIG_PACKAGE_airoha-ponctl=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-pon=y$' .config
          echo "config verified for $TARGET"

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      # End-to-end proof that the firmware carries the patched driver.
      #
      # Do NOT fingerprint on the MODULE_PARM_DESC text: the packaged module is
      # run through OpenWrt's scripts/strip-kmod.sh, whose
      # "objcopy -x -G __this_module --strip-unneeded" drops every
      # non-allocated section, .modinfo included. The format string used below
      # is reachable from code, so it lands in .rodata and survives stripping,
      # and the phrase does not exist anywhere in the upstream source.
      - name: Verify the built module came from the patched source
        run: |
          fingerprint='digital RX mode readback'
          found=''
          for f in $(find build_dir feeds \
                       \( -name 'airoha-xpon-xgpon.o' -o -name 'airoha-xpon.ko*' \) \
                       -print 2>/dev/null); do
            if strings "$f" 2>/dev/null | grep -q "$fingerprint"; then
              echo "fingerprint present in $f"
              found="$f"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::the built module lacks the patch fingerprint, refusing to release"
            echo "--- candidates inspected ---"
            find build_dir feeds \
              \( -name 'airoha-xpon-xgpon.o' -o -name 'airoha-xpon.ko*' \) \
              -exec sh -c 'printf "%10s  %s\n" "$(stat -c%s "$1")" "$1"' _ {} \;
            exit 1
          fi
          echo "patch fingerprint present ($found)"

      # The second half of the change: without it the kernel answers GPON while
      # LuCI still offers only the four 10G modes. The PON page is a plain file
      # in the rootfs, so it can be fingerprinted directly. uglifyjs rewrites
      # the formatting, not the string literals, hence matching the quoted mode
      # name rather than anything about the surrounding code.
      #
      # The quotes are part of the pattern on purpose: a bare "gpon" also
      # matches the pre-existing "xgpon", which is exactly the entry that was
      # already there.
      - name: Verify the PON page offers the GPON line mode
        run: |
          page=''
          for f in $(find build_dir \
                       -path '*/www/luci-static/resources/view/pon/config.js' \
                       -print 2>/dev/null); do
            page="$f"
            break
          done
          if [ -z "$page" ]; then
            echo "::error::luci-app-pon was not installed anywhere in build_dir"
            find build_dir -path '*pon*' -name 'config.js' -print 2>/dev/null || true
            exit 1
          fi
          echo "checking $page ($(stat -c%s "$page") bytes)"
          if ! grep -Eq "['\"]gpon['\"]" "$page"; then
            echo "::error::the installed PON page offers no gpon line mode"
            grep -o "o\.value('[^']*'" "$page" || true
            exit 1
          fi
          echo "the PON page offers the gpon line mode"

      # Advisory only. OpenWrt keeps logs/package/<step>.txt for failed steps;
      # a successful package build may leave no log at all, so this must not
      # fail the job.
      - name: Show the package compile log if present
        run: |
          log=logs/package/feeds/pon_drivers/airoha-xpon/compile.txt
          if [ -f "$log" ]; then
            echo "found $log"
            grep -o 'airoha-xpon[a-z-]*\.c' "$log" | sort -u || true
          else
            echo "no per-package compile log (the step succeeded, which is normal)"
            find logs -path '*airoha*' -name '*.txt' -print 2>/dev/null || true
          fi

      - name: Verify the board images exist
        env:
          TARGET: ${{ matrix.target }}
          IMAGE_GLOB: ${{ matrix.image_glob }}
        run: |
          dir="bin/targets/airoha/$TARGET"
          images=$(find "$dir" -maxdepth 1 -name "$IMAGE_GLOB" -print)
          [ -n "$images" ] || {
            echo "::error::no sysupgrade image matching $IMAGE_GLOB for $TARGET"
            ls -l "$dir"
            exit 1
          }
          echo "$images"
          echo "image count: $(printf '%s\n' "$images" | wc -l)"

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG (GPON)"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
